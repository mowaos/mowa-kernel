name: Release

# Pushing a tag such as v0.5.0 builds the release from that exact commit and publishes
# a GitHub Release with the source archive, the WASM builds and SHA256SUMS.
# Nothing is built or packaged by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Public gate (includes tag-matches-version check)
        run: bash scripts/check-public.sh "$GITHUB_REF_NAME"

      - run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-bindgen CLI (version pinned in Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: npm install --global typescript@5.7.3

      - name: Full test suite (builds pkg/ and pkg-web/)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          npm test

      - name: Package release assets
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir -p dist-release
          git archive --format=tar.gz --prefix="mowa-kernel-${tag}/" -o "dist-release/mowa-kernel-${tag}-source.tar.gz" "$tag"
          tar -czf "dist-release/mowa-kernel-${tag}-wasm-web.tar.gz" --sort=name --owner=0 --group=0 --numeric-owner --mtime='1970-01-01' pkg-web
          tar -czf "dist-release/mowa-kernel-${tag}-wasm-node.tar.gz" --sort=name --owner=0 --group=0 --numeric-owner --mtime='1970-01-01' pkg
          cp pkg-web/mowa_wasm_bg.wasm "dist-release/mowa_wasm_bg-${tag}.wasm"
          (cd dist-release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify downloads with: sha256sum -c SHA256SUMS"
