[workspace]
resolver = "2"
members = ["crates/mowa-canon", "crates/mowa-flow", "crates/mowa-core", "crates/mowa-wasm", "crates/mowa-kernel"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Bruce Gardiner (ScrAtcH)"]
repository = "https://github.com/mowaos/mowa-kernel"
homepage = "https://github.com/mowaos/mowa-kernel"
readme = "README.md"
keywords = ["fsm", "workflow", "deterministic", "audit", "wasm"]
categories = ["algorithms", "wasm"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
proptest = "1"
wasm-bindgen = "0.2"
mowa-canon = { path = "crates/mowa-canon", version = "=0.5.0" }
mowa-flow = { path = "crates/mowa-flow", version = "=0.5.0" }
mowa-core = { path = "crates/mowa-core", version = "=0.5.0" }

# Strict determinism and safety lints
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
